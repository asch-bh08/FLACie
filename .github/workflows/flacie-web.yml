# Builds the FLACie Web Docker image and publishes it to GitHub Container Registry as
# ghcr.io/<owner>/flacie-web (":latest" from main, ":1.2.3" from a v1.2.3 tag), for amd64 and arm64.
name: FLACie Web image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "ipodsync/src/FLACie.Core/**"
      - "ipodsync/src/FLACie.Server/**"
      - ".github/workflows/flacie-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/flacie-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ipodsync/src
          file: ipodsync/src/FLACie.Server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
