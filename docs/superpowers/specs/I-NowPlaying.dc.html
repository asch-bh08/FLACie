<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Now Playing, your mix</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Archivo:wght@500;700&amp;family=DM+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#fff}a:hover{color:#ddd}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{ground}}; color: #f4efe6; font-family: 'Archivo', sans-serif">
  <div role="img" aria-label="[ALBUM COVER]" style="position: absolute; left: 0; top: 0; width: 390px; height: 520px; overflow: hidden; background: #2f5d62">
    <div style="position: absolute; width: 560px; height: 560px; border-radius: 50%; left: 130px; top: -200px; background: {{accent}}"></div>
    <div style="position: absolute; width: 340px; height: 340px; border-radius: 50%; left: -110px; top: 270px; background: #f2c6a0"></div>
    <div style="position: absolute; width: 110px; height: 110px; border-radius: 50%; left: 250px; top: 300px; background: {{ground}}"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 0; top: 220px; width: 390px; height: 304px; background: linear-gradient(to bottom, rgba(0,0,0,0), {{ground}} 92%)"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 110px; background: linear-gradient(to bottom, rgba(0,0,0,.4), rgba(0,0,0,0))"></div>

  <div style="position: absolute; left: 16px; right: 16px; top: 14px; display: flex; justify-content: space-between; align-items: center">
    <button aria-label="Close" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(0,0,0,.28); color: #fff; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <span style="font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .14em; padding: 7px 12px; border-radius: 14px; background: rgba(0,0,0,.28)">NIGHT LINES · TRACK 4</span>
    <button aria-label="Retro" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(0,0,0,.28); color: #fff; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="8.5" cy="12" r="2"/><circle cx="15.5" cy="12" r="2"/></svg></button>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; top: 392px; display: flex; align-items: flex-end; gap: 12px">
    <div style="flex: 1; min-width: 0">
      <div style="font-family: 'Instrument Serif', serif; font-size: 52px; line-height: .95; letter-spacing: -.01em">Slow <i>Satellite</i></div>
      <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px">
        <span style="font-size: 17px; font-weight: 700">Marlow Fen</span>
        <span style="font-family: 'DM Mono', monospace; font-size: 11px; padding: 4px 8px; border-radius: 8px; background: {{tone}}; color: {{tonefg}}">FLAC 24/96</span>
      </div>
    </div>
    <button aria-label="Favourite" style="flex: none; width: 52px; height: 52px; border: 0; border-radius: 26px; background: {{tone}}; color: {{tonefg}}; display: grid; place-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; top: 512px; height: 168px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Shuffle" style="width: 44px; height: 44px; border: 0; background: none; color: rgba(244,239,230,.8)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3 7h3c4 0 6 10 10 10h5M3 17h3c1.5 0 2.7-1.4 3.7-3M14.3 10C15.3 8.4 16.5 7 18 7h3M18 4l3 3-3 3M18 14l3 3-3 3"/></svg></button>
    <button aria-label="Previous" style="width: 58px; height: 52px; border: 0; border-radius: 26px; background: {{tone}}; color: {{tonefg}}; display: grid; place-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zM19 6v12l-10-6z"/></svg></button>
    <div style="position: relative; width: 168px; height: 168px; flex: none">
      <div aria-hidden="true" style="position: absolute; inset: 0">
        <sc-for list="{{ring}}" as="r" hint-placeholder-count="80"><div style="position: absolute; left: 82px; top: 0; width: 4px; height: 84px; transform-origin: 2px 84px; transform: rotate({{r.a}}deg)"><div style="width: 4px; height: {{r.h}}; border-radius: 2px; background: {{r.c}}"></div></div></sc-for>
      </div>
      <button aria-label="Pause" style="position: absolute; left: 39px; top: 49px; width: 90px; height: 70px; border: 0; border-radius: 26px; background: {{accent}}; color: #1a120c; display: grid; place-items: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5.5" y="4" width="4.2" height="16" rx="1.4"/><rect x="14.3" y="4" width="4.2" height="16" rx="1.4"/></svg></button>
    </div>
    <button aria-label="Next" style="width: 58px; height: 52px; border: 0; border-radius: 26px; background: {{tone}}; color: {{tonefg}}; display: grid; place-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zM5 6v12l10-6z"/></svg></button>
    <button aria-label="Repeat" style="width: 44px; height: 44px; border: 0; background: none; color: rgba(244,239,230,.8)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/></svg></button>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 684px; text-align: center; font-family: 'DM Mono', monospace; font-size: 12px; color: rgba(244,239,230,.75)">1:36 / 4:12</div>

  <div style="position: absolute; left: 24px; right: 24px; top: 710px; display: flex; justify-content: center; gap: 10px">
    <button style="height: 40px; padding: 0 18px; border: 1px solid rgba(244,239,230,.4); border-radius: 12px; background: none; color: #f4efe6; font: inherit; font-size: 14px; font-weight: 500">Lyrics</button>
    <button style="height: 40px; padding: 0 18px; border: 1px solid rgba(244,239,230,.4); border-radius: 12px; background: none; color: #f4efe6; font: inherit; font-size: 14px; font-weight: 500">Up next</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff9b6e","options":["#ff9b6e","#a9e3d0","#c9a2ff","#f5e15a"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#ff9b6e';
    const ring = [];
    for (let i = 0; i < 80; i++) { const v = .2 + .8 * Math.abs(Math.sin(i * .37) * Math.cos(i * .11 + 1) + .3 * Math.sin(i * 1.4)); ring.push({ a: i * 4.5, h: Math.max(4, Math.round(v * 22)) + 'px', c: i < 30 ? accent : 'rgba(244,239,230,.25)' }); }
    return { accent, ring, ground: '#163a3f', tone: '#24525a', tonefg: '#e7f3f0' };
  }
}
</script>
</body>
</html>
