<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Now playing bar, PC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Archivo:wght@500;700&amp;family=DM+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#fff}a:hover{color:#ddd}
</style>
</helmet>
<div style="width: 1440px; height: 96px; position: relative; overflow: hidden; background: #101416; color: #f4efe6; font-family: 'Archivo', sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,155,110,.22), rgba(22,58,63,.6) 40%, #101416 75%)"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 3px; background: rgba(244,239,230,.12)"><div style="width: 41%; height: 3px; background: #ff9b6e"></div></div>
  <div style="position: absolute; inset: 3px 24px 0 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 24px">
    <button aria-label="Open Now Playing" style="display: flex; align-items: center; gap: 14px; min-width: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; padding: 0">
      <span role="img" aria-label="[ALBUM COVER]" style="flex: none; width: 62px; height: 62px; border-radius: 14px; overflow: hidden; background: #2f5d62; position: relative"><span style="position: absolute; width: 70px; height: 70px; border-radius: 50%; left: 24px; top: -24px; background: #ff9b6e"></span></span>
      <span style="min-width: 0">
        <span style="display: block; font-family: 'Instrument Serif', serif; font-size: 24px; line-height: 1">Orange <i>Crush</i></span>
        <span style="display: block; font-size: 13px; color: rgba(244,239,230,.75); margin-top: 4px">R.E.M. · <span style="font-family: 'DM Mono', monospace; font-size: 11px">FLAC 16/44.1</span></span>
      </span>
    </button>
    <div style="display: flex; align-items: center; gap: 12px">
      <button aria-label="Shuffle" style="width: 40px; height: 40px; border: 0; background: none; color: rgba(244,239,230,.75)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3 7h3c4 0 6 10 10 10h5M3 17h3c1.5 0 2.7-1.4 3.7-3M14.3 10C15.3 8.4 16.5 7 18 7h3M18 4l3 3-3 3M18 14l3 3-3 3"/></svg></button>
      <button aria-label="Previous" style="width: 50px; height: 44px; border: 0; border-radius: 22px; background: #24525a; color: #e7f3f0; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zM19 6v12l-10-6z"/></svg></button>
      <button aria-label="Pause" style="width: 66px; height: 52px; border: 0; border-radius: 20px; background: #ff9b6e; color: #1a120c; display: grid; place-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5.5" y="4" width="4.2" height="16" rx="1.4"/><rect x="14.3" y="4" width="4.2" height="16" rx="1.4"/></svg></button>
      <button aria-label="Next" style="width: 50px; height: 44px; border: 0; border-radius: 22px; background: #24525a; color: #e7f3f0; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zM5 6v12l10-6z"/></svg></button>
      <button aria-label="Repeat" style="width: 40px; height: 40px; border: 0; background: none; color: rgba(244,239,230,.75)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/></svg></button>
      <span style="font-family: 'DM Mono', monospace; font-size: 12px; color: rgba(244,239,230,.75); margin-left: 6px">1:36 / 3:52</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 6px; color: rgba(244,239,230,.8)">
      <button aria-label="Favourite" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: none; color: #ff9b6e"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
      <button aria-label="Retro" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: none; color: inherit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="8.5" cy="12" r="2"/><circle cx="15.5" cy="12" r="2"/></svg></button>
      <button aria-label="Devices" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: none; color: inherit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"/><circle cx="12" cy="14" r="2.5"/></svg></button>
      <span style="display: flex; align-items: center; gap: 8px; margin: 0 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M5 9v6h3l5 4V5L8 9zM16.5 9a4 4 0 0 1 0 6"/></svg><span style="display: block; width: 110px; height: 4px; border-radius: 2px; background: rgba(244,239,230,.25)"><span style="display: block; width: 70%; height: 4px; border-radius: 2px; background: #f4efe6"></span></span></span>
      <button aria-label="Mini player" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: none; color: inherit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1"/></svg></button>
      <button aria-label="Close the player" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: none; color: inherit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":96}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
