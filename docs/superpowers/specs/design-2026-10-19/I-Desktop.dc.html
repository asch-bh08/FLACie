<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Now Playing on PC, your mix</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Archivo:wght@500;700&amp;family=DM+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#fff}a:hover{color:#ddd}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #163a3f; color: #f4efe6; font-family: 'Archivo', sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden">
    <div style="position: absolute; width: 1200px; height: 1200px; border-radius: 50%; left: -460px; top: -560px; background: radial-gradient(closest-side, rgba(255,155,110,.5), rgba(255,155,110,0))"></div>
    <div style="position: absolute; width: 900px; height: 900px; border-radius: 50%; left: -160px; top: 460px; background: radial-gradient(closest-side, rgba(242,198,160,.2), rgba(242,198,160,0))"></div>
  </div>

  <div style="position: absolute; left: 28px; right: 28px; top: 18px; display: flex; justify-content: space-between; align-items: center">
    <button aria-label="Close" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(0,0,0,.25); color: #fff; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <span style="font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .14em; color: rgba(244,239,230,.75)">PLAYING FROM YOUR QUEUE</span>
    <div style="display: flex; gap: 8px"><button aria-label="Song options: rating, speed, sleep timer, sound" style="height: 44px; padding: 0 16px; border: 0; border-radius: 22px; background: rgba(0,0,0,.25); color: #fff; font: inherit; font-size: 14px; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Options</button><button aria-label="Retro" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #24525a; color: #e7f3f0; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="8.5" cy="12" r="2"/><circle cx="15.5" cy="12" r="2"/></svg></button></div>
  </div>

  <div style="position: absolute; left: 40px; width: 560px; top: 76px; height: 680px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px">
    <div role="img" aria-label="[ALBUM COVER]" style="position: relative; flex: none; width: 440px; height: 440px; border-radius: 26px; overflow: hidden; background: #2f5d62; box-shadow: 0 34px 80px rgba(0,0,0,.45)">
      <div style="position: absolute; width: 550px; height: 550px; border-radius: 50%; left: 170px; top: -210px; background: #ff9b6e"></div>
      <div style="position: absolute; width: 330px; height: 330px; border-radius: 50%; left: -100px; top: 255px; background: #f2c6a0"></div>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 16px; width: 440px">
      <div style="flex: 1; min-width: 0">
        <div style="font-family: 'Instrument Serif', serif; font-size: 52px; line-height: 1">Orange <i>Crush</i></div>
        <div style="font-size: 15px; color: rgba(244,239,230,.8); margin-top: 8px"><b style="color: #f4efe6">R.E.M.</b> · In Time: The Best Of R.E.M.</div>
        <span style="display: inline-block; margin-top: 10px; font-family: 'DM Mono', monospace; font-size: 11px; padding: 4px 10px; border-radius: 8px; background: #24525a; color: #e7f3f0">FLAC · 16/44.1</span>
      </div>
      <button aria-label="Favourite" style="flex: none; width: 50px; height: 50px; border: 0; border-radius: 25px; background: #24525a; color: #ff9b6e; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 128px; background: linear-gradient(to bottom, rgba(16,20,22,0), rgba(16,20,22,.55)); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 40px; box-sizing: border-box">
    <div style="font-family: 'DM Mono', monospace; font-size: 13px; color: rgba(244,239,230,.8)">1:36 <span style="color: rgba(244,239,230,.45)">/ 3:52</span></div>
    <div style="display: flex; align-items: center; gap: 18px">
      <button aria-label="Shuffle" style="width: 44px; height: 44px; border: 0; background: none; color: rgba(244,239,230,.8)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3 7h3c4 0 6 10 10 10h5M3 17h3c1.5 0 2.7-1.4 3.7-3M14.3 10C15.3 8.4 16.5 7 18 7h3M18 4l3 3-3 3M18 14l3 3-3 3"/></svg></button>
      <button aria-label="Previous" style="width: 60px; height: 52px; border: 0; border-radius: 26px; background: #24525a; color: #e7f3f0; display: grid; place-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zM19 6v12l-10-6z"/></svg></button>
      <div style="position: relative; width: 116px; height: 116px; flex: none">
        <div aria-hidden="true" style="position: absolute; inset: 0">
          <sc-for list="{{ring}}" as="r" hint-placeholder-count="88"><div style="position: absolute; left: 56px; top: 0; width: 4px; height: 58px; transform-origin: 2px 58px; transform: rotate({{r.a}}deg)"><div style="width: 3px; height: {{r.h}}; border-radius: 2px; background: {{r.c}}"></div></div></sc-for>
        </div>
        <button aria-label="Pause" style="position: absolute; left: 26px; top: 32px; width: 64px; height: 52px; border: 0; border-radius: 20px; background: #ff9b6e; color: #1a120c; display: grid; place-items: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5.5" y="4" width="4.2" height="16" rx="1.4"/><rect x="14.3" y="4" width="4.2" height="16" rx="1.4"/></svg></button>
      </div>
      <button aria-label="Next" style="width: 60px; height: 52px; border: 0; border-radius: 26px; background: #24525a; color: #e7f3f0; display: grid; place-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zM5 6v12l10-6z"/></svg></button>
      <button aria-label="Repeat" style="width: 44px; height: 44px; border: 0; background: none; color: rgba(244,239,230,.8)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/></svg></button>
    </div>
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px; color: rgba(244,239,230,.8)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M5 9v6h3l5 4V5L8 9zM16.5 9a4 4 0 0 1 0 6"/></svg>
      <span aria-label="Volume" style="display: block; width: 140px; height: 4px; border-radius: 2px; background: rgba(244,239,230,.25)"><span style="display: block; width: 70%; height: 4px; border-radius: 2px; background: #f4efe6"></span></span>
    </div>
  </div>

  <div style="position: absolute; left: 640px; right: 40px; top: 84px; bottom: 140px; padding: 22px 24px; border-radius: 26px; background: rgba(0,0,0,.2); display: flex; flex-direction: column; overflow: hidden">
    <div role="tablist" style="display: flex; gap: 8px">
      <button role="tab" aria-selected="true" style="height: 40px; padding: 0 16px; border: 0; border-radius: 12px; background: #f4efe6; color: #163a3f; font: inherit; font-size: 14px; font-weight: 700">Up next</button>
      <button role="tab" aria-selected="false" style="height: 40px; padding: 0 16px; border: 1px solid rgba(244,239,230,.4); border-radius: 12px; background: none; color: #f4efe6; font: inherit; font-size: 14px">Lyrics</button>
      <button role="tab" aria-selected="false" style="height: 40px; padding: 0 16px; border: 1px solid rgba(244,239,230,.4); border-radius: 12px; background: none; color: #f4efe6; font: inherit; font-size: 14px">Info</button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding: 14px 16px; border-radius: 16px; background: rgba(36,82,90,.5)">
      <div>
        <div style="font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .1em; color: rgba(244,239,230,.7)">PLAYING FROM</div>
        <div style="font-family: 'Instrument Serif', serif; font-size: 26px; line-height: 1.1">Your <i>queue</i></div>
      </div>
      <label style="display: flex; align-items: center; gap: 12px; font-size: 14px">
        <span style="text-align: right"><b>Autoplay</b><br><span style="font-size: 12px; color: rgba(244,239,230,.7)">Similar songs after the queue</span></span>
        <span role="switch" aria-checked="true" aria-label="Autoplay" style="position: relative; width: 46px; height: 26px; border-radius: 13px; background: #ff9b6e"><span style="position: absolute; right: 3px; top: 3px; width: 20px; height: 20px; border-radius: 10px; background: #1a120c"></span></span>
      </label>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px; margin-top: 10px">
      <div style="display: flex; align-items: center; gap: 14px; padding: 8px 10px; border-radius: 14px; background: rgba(255,155,110,.18)">
        <div aria-hidden="true" style="flex: none; width: 46px; height: 46px; border-radius: 10px; background: #2f5d62; position: relative; overflow: hidden"><div style="position: absolute; width: 50px; height: 50px; border-radius: 50%; left: 16px; top: -16px; background: #ff9b6e"></div></div>
        <div style="flex: 1; min-width: 0"><div style="font-size: 15px; font-weight: 700">Orange Crush</div><div style="font-size: 13px; color: rgba(244,239,230,.75)">R.E.M.</div></div>
        <span style="font-family: 'DM Mono', monospace; font-size: 11px; padding: 3px 8px; border-radius: 7px; background: #ff9b6e; color: #1a120c">NOW</span>
      </div>
      <sc-for list="{{queue}}" as="q" hint-placeholder-count="8">
        <div style="display: flex; align-items: center; gap: 14px; padding: 8px 10px; border-radius: 14px">
          <div aria-hidden="true" style="flex: none; width: 46px; height: 46px; border-radius: 10px; background: {{q.c}}"></div>
          <div style="flex: 1; min-width: 0"><div style="font-size: 15px; font-weight: 700">{{q.t}}</div><div style="font-size: 13px; color: rgba(244,239,230,.72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{q.a}}</div></div>
          <span style="font-family: 'DM Mono', monospace; font-size: 12px; color: rgba(244,239,230,.72); width: 40px; text-align: right">{{q.d}}</span>
          <button aria-label="Options for this song: move, play next, remove" style="width: 36px; height: 36px; border: 0; border-radius: 18px; background: none; color: rgba(244,239,230,.7)"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg></button>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ring = [];
    for (let i = 0; i < 88; i++) { const v = .2 + .8 * Math.abs(Math.sin(i * .37) * Math.cos(i * .11 + 1) + .3 * Math.sin(i * 1.4)); ring.push({ a: i * 4.09, h: Math.max(4, Math.round(v * 14)) + 'px', c: i < 36 ? '#ff9b6e' : 'rgba(244,239,230,.25)' }); }
    const tools = [
      { l: 'Favourite', d: 'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z' },
      { l: 'Rating', d: 'M12 4l2.4 5 5.4.6-4 3.7 1.1 5.4L12 16l-4.9 2.7 1.1-5.4-4-3.7 5.4-.6z' },
      { l: 'Speed', d: 'M5 17a8 8 0 1 1 14 0M12 13l3.5-4' },
      { l: 'Sleep timer', d: 'M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z' },
      { l: 'Sound', d: 'M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2' },
      { l: 'More', d: 'M6 12h.01M12 12h.01M18 12h.01' }
    ];
    const queue = [
      { t: '(Don’t Fear) The Reaper', a: 'Blue Öyster Cult · The Essential Blue Öyster Cult', d: '5:08', c: '#4a4a52' },
      { t: 'Hypnotize (2007 Remaster)', a: 'The Notorious B.I.G. · Greatest Hits', d: '3:50', c: '#6b5a4a' },
      { t: 'Kiss Me', a: 'Sixpence None The Richer · Top Ten', d: '3:28', c: '#7a8c5a' },
      { t: 'STIR IT UP', a: 'Johnny Nash · Radio Hits Of the ’70s', d: '3:02', c: '#3a3a40' },
      { t: 'Moonlight Sonata', a: '100 Piano Classics · 100 Ultimate Piano Classics', d: '1:51', c: '#2a2a2a' },
      { t: 'Numb', a: 'U2 · Zooropa', d: '4:19', c: '#c9a2ff' },
      { t: 'Gimme Shelter (Remastered 2019)', a: 'The Rolling Stones · Let It Bleed', d: '4:30', c: '#5c2a2a' },
      { t: 'Ring of Fire', a: 'Johnny Cash · The Essential Johnny Cash', d: '2:35', c: '#555' }
    ];
    return { ring, tools, queue };
  }
}
</script>
</body>
</html>
