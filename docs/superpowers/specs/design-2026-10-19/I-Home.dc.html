<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, your mix</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Archivo:wght@500;700&amp;family=DM+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4efe6;text-decoration:none}a:hover{color:#fff}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #101416; color: #f4efe6; font-family: 'Archivo', sans-serif">
  <div role="img" aria-label="[ALBUM COVER of what played last]" style="position: absolute; left: 0; top: 0; width: 390px; height: 300px; overflow: hidden; background: #2f5d62">
    <div style="position: absolute; width: 420px; height: 420px; border-radius: 50%; left: 120px; top: -180px; background: #ff9b6e"></div>
    <div style="position: absolute; width: 240px; height: 240px; border-radius: 50%; left: -90px; top: 150px; background: #f2c6a0"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 0; top: 80px; width: 390px; height: 224px; background: linear-gradient(to bottom, rgba(16,20,22,0), #101416 92%)"></div>

  <div style="position: absolute; left: 20px; right: 20px; top: 16px; display: flex; justify-content: space-between; align-items: center">
    <span style="font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .14em; padding: 7px 12px; border-radius: 14px; background: rgba(0,0,0,.3)">FLACIE</span>
    <button aria-label="Account" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #24525a; color: #e7f3f0; font: inherit; font-weight: 700">A</button>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; top: 170px">
    <div style="font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .12em; color: rgba(244,239,230,.75)">GOOD EVENING</div>
    <div style="font-family: 'Instrument Serif', serif; font-size: 46px; line-height: .95; margin-top: 6px">Pick up <i>where you left off</i></div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 300px">
    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 24px; background: #1d2a2c; color: rgba(244,239,230,.7)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      <input aria-label="Search" placeholder="Songs, albums, artists" style="flex: 1; border: 0; background: none; color: #f4efe6; font: inherit; font-size: 15px; outline: none">
    </label>
    <div style="display: flex; gap: 8px; margin-top: 12px">
      <button style="height: 36px; padding: 0 14px; border: 0; border-radius: 12px; background: #ff9b6e; color: #1a120c; font: inherit; font-size: 13px; font-weight: 700">For you</button>
      <button style="height: 36px; padding: 0 14px; border: 1px solid rgba(244,239,230,.35); border-radius: 12px; background: none; color: #f4efe6; font: inherit; font-size: 13px; font-weight: 500">Albums</button>
      <button style="height: 36px; padding: 0 14px; border: 1px solid rgba(244,239,230,.35); border-radius: 12px; background: none; color: #f4efe6; font: inherit; font-size: 13px; font-weight: 500">Artists</button>
      <button style="height: 36px; padding: 0 14px; border: 1px solid rgba(244,239,230,.35); border-radius: 12px; background: none; color: #f4efe6; font: inherit; font-size: 13px; font-weight: 500">Hi-Res</button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 22px">
      <div style="font-family: 'Instrument Serif', serif; font-size: 26px">Recently <i>played</i></div>
      <a href="#" style="font-size: 13px; font-weight: 700; color: rgba(244,239,230,.7)">See all</a>
    </div>
    <div style="display: flex; gap: 12px; margin-top: 10px">
      <sc-for list="{{albums}}" as="a" hint-placeholder-count="3">
        <div style="flex: none; width: 108px">
          <div role="img" aria-label="[ALBUM COVER]" style="width: 108px; height: 108px; border-radius: 14px; background: {{a.c}}; position: relative; overflow: hidden"><div style="position: absolute; width: 90px; height: 90px; border-radius: 50%; right: -20px; top: -20px; background: {{a.d}}"></div></div>
          <div style="font-size: 14px; font-weight: 700; margin-top: 8px">{{a.t}}</div>
          <div style="font-size: 12px; color: rgba(244,239,230,.7)">{{a.a}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 96px; display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 20px; background: #1d3a3e">
    <div aria-hidden="true" style="flex: none; width: 48px; height: 48px; border-radius: 12px; background: #2f5d62; position: relative; overflow: hidden"><div style="position: absolute; width: 52px; height: 52px; border-radius: 50%; left: 18px; top: -18px; background: #ff9b6e"></div></div>
    <div style="flex: 1; min-width: 0">
      <div style="font-family: 'Instrument Serif', serif; font-size: 20px; line-height: 1">Slow <i>Satellite</i></div>
      <div style="font-size: 12px; color: rgba(244,239,230,.75); margin-top: 3px">Marlow Fen</div>
    </div>
    <button aria-label="Pause" style="width: 54px; height: 44px; border: 0; border-radius: 16px; background: #ff9b6e; color: #1a120c; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5.5" y="4" width="4.2" height="16" rx="1.4"/><rect x="14.3" y="4" width="4.2" height="16" rx="1.4"/></svg></button>
    <button aria-label="Next" style="width: 48px; height: 44px; border: 0; border-radius: 22px; background: #24525a; color: #e7f3f0; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zM5 6v12l10-6z"/></svg></button>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 12px; background: #101416; border-top: 1px solid rgba(244,239,230,.08)">
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #ff9b6e"><span style="display: grid; place-items: center; width: 56px; height: 30px; border-radius: 15px; background: #3a2a22"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg></span>Home</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: rgba(244,239,230,.75)"><span style="display: grid; place-items: center; width: 56px; height: 30px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></svg></span>Library</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: rgba(244,239,230,.75)"><span style="display: grid; place-items: center; width: 56px; height: 30px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg></span>Playlists</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: rgba(244,239,230,.75)"><span style="display: grid; place-items: center; width: 56px; height: 30px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="8.5" cy="12" r="2"/><circle cx="15.5" cy="12" r="2"/></svg></span>Retro</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { albums: [
      { t: 'Night Lines', a: 'Marlow Fen', c: '#2f5d62', d: '#ff9b6e' },
      { t: 'Paper Moons', a: 'Ilse Varga', c: '#3b2a5c', d: '#c9a2ff' },
      { t: 'Low Tide', a: 'The Quiet Hours', c: '#5c4a1e', d: '#f5e15a' }
    ] };
  }
}
</script>
</body>
</html>
