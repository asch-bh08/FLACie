<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Editorial player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1b1410}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #efe6d8; color: #1b1410; font-family: 'Manrope', sans-serif">
  <div role="img" aria-label="[ALBUM COVER]" style="position: absolute; left: 0; top: 0; width: 390px; height: 470px; overflow: hidden; background: #2f5d62">
    <div style="position: absolute; width: 420px; height: 420px; border-radius: 50%; left: 120px; top: -140px; background: #e8774f"></div>
    <div style="position: absolute; width: 260px; height: 260px; border-radius: 50%; left: -70px; top: 250px; background: #f2c6a0"></div>
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(239,230,216,0) 55%, #efe6d8 100%)"></div>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; top: 18px; display: flex; justify-content: space-between; align-items: center; color: #fff">
    <button aria-label="Close" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(0,0,0,.25); color: #fff; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <div style="font-size: 11px; font-weight: 800; letter-spacing: .18em; padding: 8px 12px; border-radius: 16px; background: rgba(0,0,0,.25)">SIDE A · TRACK 4</div>
    <button aria-label="More" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(0,0,0,.25); color: #fff; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <div style="position: absolute; left: 24px; right: 24px; top: 392px">
    <div style="font-family: 'Instrument Serif', serif; font-size: 64px; line-height: .92; letter-spacing: -.02em">Slow<br><i>Satellite</i></div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px; padding-bottom: 14px; border-bottom: 1.5px solid #1b1410">
      <span style="font-weight: 800; font-size: 15px">Marlow Fen</span>
      <span style="font-size: 13px; color: #5b4c40">Night Lines, 2024 · FLAC 24/96</span>
    </div>
  </div>
  <div style="position: absolute; left: 24px; right: 24px; top: 620px">
    <div aria-hidden="true" style="display: flex; align-items: center; gap: 2px; height: 34px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="64"><div style="flex: 1 1 0; height: {{b.h}}; background: {{b.c}}"></div></sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; margin-top: 8px; font-variant-numeric: tabular-nums"><span>1:36</span><span>4:12</span></div>
  </div>
  <div style="position: absolute; left: 24px; right: 24px; bottom: 44px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Lyrics" style="height: 48px; padding: 0 18px; border: 1.5px solid #1b1410; border-radius: 24px; background: none; font: inherit; font-weight: 800; font-size: 13px; color: #1b1410">Lyrics</button>
    <div style="display: flex; align-items: center; gap: 14px">
      <button aria-label="Previous" style="width: 48px; height: 48px; border: 0; background: none; color: #1b1410"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 6h2v12H7zM19 6v12l-9-6z"/></svg></button>
      <button aria-label="Pause" style="width: 76px; height: 76px; border: 0; border-radius: 38px; background: #1b1410; color: #efe6d8; display: grid; place-items: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <button aria-label="Next" style="width: 48px; height: 48px; border: 0; background: none; color: #1b1410"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15 6h2v12h-2zM5 6v12l9-6z"/></svg></button>
    </div>
    <button aria-label="Up next" style="height: 48px; padding: 0 18px; border: 1.5px solid #1b1410; border-radius: 24px; background: none; font: inherit; font-weight: 800; font-size: 13px; color: #1b1410">Queue</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const bars = [];
    for (let i = 0; i < 64; i++) { const v = .25 + .75 * Math.abs(Math.sin(i * .41) * Math.cos(i * .12 + 1) + .3 * Math.sin(i * 1.6)); bars.push({ h: Math.max(4, Math.round(v * 32)) + 'px', c: i < 25 ? '#c4532f' : 'rgba(27,20,16,.25)' }); }
    return { bars };
  }
}
</script>
</body>
</html>
