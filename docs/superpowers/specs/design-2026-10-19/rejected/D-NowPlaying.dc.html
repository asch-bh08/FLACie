<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Now Playing, B+C</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Manrope:wght@500;600;700;800&amp;family=DM+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#fff}a:hover{color:#ddd}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0b0f12; color: #f6f3ee; font-family: 'Manrope', sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: -80px; overflow: hidden">
    <div style="position: absolute; width: 720px; height: 720px; border-radius: 50%; left: -260px; top: -300px; background: radial-gradient(closest-side, {{accent}}, rgba(0,0,0,0)); opacity: .75"></div>
    <div style="position: absolute; width: 640px; height: 640px; border-radius: 50%; left: 60px; top: 420px; background: radial-gradient(closest-side, #2f8f86, rgba(0,0,0,0)); opacity: .7"></div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 14px; display: flex; justify-content: space-between; align-items: center">
    <button aria-label="Close" style="width: 44px; height: 44px; border: 0; border-radius: 14px; background: rgba(255,255,255,.12); color: #f6f3ee; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9.5l7 6 7-6"/></svg></button>
    <div style="display: flex; gap: 6px">
      <button aria-label="Up next" style="width: 44px; height: 44px; border: 0; border-radius: 14px; background: rgba(255,255,255,.12); color: #f6f3ee; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5h12M4 12h12M4 17.5h7M16 15v6l4.5-3z"/></svg></button>
      <button aria-label="Song info" style="width: 44px; height: 44px; border: 0; border-radius: 14px; background: rgba(255,255,255,.12); color: #f6f3ee; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.6v.2"/></svg></button>
      <button aria-label="Retro" style="width: 44px; height: 44px; border: 0; border-radius: 14px; background: rgba(255,255,255,.12); color: #f6f3ee; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3"/><circle cx="8.5" cy="12" r="2"/><circle cx="15.5" cy="12" r="2"/></svg></button>
      <button aria-label="More" style="width: 44px; height: 44px; border: 0; border-radius: 14px; background: rgba(255,255,255,.12); color: #f6f3ee; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg></button>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 50%; top: 196px; width: 316px; height: 316px; margin-left: -158px; margin-top: -158px">
    <sc-for list="{{ring}}" as="r" hint-placeholder-count="96"><div style="position: absolute; left: 156px; top: 0; width: 4px; height: 158px; transform-origin: 2px 158px; transform: rotate({{r.a}}deg)"><div style="width: 4px; height: {{r.h}}; border-radius: 2px; background: {{r.c}}"></div></div></sc-for>
  </div>
  <div role="img" aria-label="[ALBUM COVER]" style="position: absolute; left: 50%; top: 196px; width: 226px; height: 226px; margin-left: -113px; margin-top: -113px; border-radius: 50%; overflow: hidden; background: #2f5d62; box-shadow: 0 24px 60px rgba(0,0,0,.55)">
    <div style="position: absolute; width: 260px; height: 260px; border-radius: 50%; left: 90px; top: -90px; background: {{accent}}"></div>
    <div style="position: absolute; width: 160px; height: 160px; border-radius: 50%; left: -40px; top: 130px; background: #f2c6a0"></div>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; top: 376px; padding: 20px 18px 14px; border-radius: 30px; background: rgba(20,24,28,.55); border: 1px solid rgba(255,255,255,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 20px 50px rgba(0,0,0,.35)">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
      <div style="min-width: 0">
        <div style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.15; letter-spacing: -.01em">Slow Satellite</div>
        <div style="font-size: 15px; color: rgba(246,243,238,.7); margin-top: 6px">Marlow Fen · Night Lines</div>
      </div>
      <button aria-label="Like" style="flex: none; width: 44px; height: 44px; border: 0; border-radius: 14px; background: rgba(255,255,255,.1); color: {{accent}}; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg></button>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-family: 'DM Mono', monospace; font-size: 12px; color: rgba(246,243,238,.65)">
      <span>1:36 / 4:12</span>
      <span style="padding: 4px 9px; border-radius: 8px; background: rgba(255,255,255,.12); color: #f6f3ee">FLAC 24/96</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 12px">
      <button aria-label="Shuffle" style="width: 44px; height: 44px; border: 0; background: none; color: rgba(246,243,238,.7)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h2.5c4.5 0 5.5 10 10 10H20M4 17h2.5c1.6 0 2.8-1.3 3.8-3M14 10c1-1.7 2.2-3 3.8-3H20M17.5 4.5L20 7l-2.5 2.5M17.5 14.5L20 17l-2.5 2.5"/></svg></button>
      <button aria-label="Previous" style="width: 54px; height: 54px; border: 0; border-radius: 18px; background: rgba(255,255,255,.1); color: #f6f3ee; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5.5" width="2.6" height="13" rx="1.3"/><path d="M19 6.6v10.8a1 1 0 0 1-1.5.9L9.4 13a1.2 1.2 0 0 1 0-2l8.1-5.3a1 1 0 0 1 1.5.9z"/></svg></button>
      <button aria-label="Pause" style="width: 76px; height: 76px; border: 0; border-radius: 26px; background: {{accent}}; color: #0b0f12; display: grid; place-items: center; box-shadow: 0 12px 30px rgba(0,0,0,.35)"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.6"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6"/></svg></button>
      <button aria-label="Next" style="width: 54px; height: 54px; border: 0; border-radius: 18px; background: rgba(255,255,255,.1); color: #f6f3ee; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="16.4" y="5.5" width="2.6" height="13" rx="1.3"/><path d="M5 6.6v10.8a1 1 0 0 0 1.5.9l8.1-5.3a1.2 1.2 0 0 0 0-2L6.5 5.7A1 1 0 0 0 5 6.6z"/></svg></button>
      <button aria-label="Repeat" style="width: 44px; height: 44px; border: 0; background: none; color: rgba(246,243,238,.7)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 4l3 3-3 3M4 12v-1.5A3.5 3.5 0 0 1 7.5 7H20M7 20l-3-3 3-3M20 12v1.5a3.5 3.5 0 0 1-3.5 3.5H4"/></svg></button>
    </div>
  </div>
  <button aria-label="Open the lyrics" style="position: absolute; left: 12px; right: 12px; top: 666px; padding: 16px 18px; border: 0; border-radius: 22px; background: rgba(255,255,255,.07); color: inherit; font: inherit; text-align: left">
    <div style="font-size: 13px; color: rgba(246,243,238,.5)">[PREVIOUS LYRIC LINE]</div>
    <div style="font-size: 17px; font-weight: 800; color: #fff; margin-top: 6px">[CURRENT LYRIC LINE]</div>
    <div style="font-size: 13px; color: rgba(246,243,238,.5); margin-top: 6px">[NEXT LYRIC LINE]</div>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff8a5c","options":["#ff8a5c","#7fd6c8","#c9a2ff","#f5e15a"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#ff8a5c';
    const ring = [];
    for (let i = 0; i < 96; i++) { const v = .2 + .8 * Math.abs(Math.sin(i * .37) * Math.cos(i * .11 + 1) + .3 * Math.sin(i * 1.4)); ring.push({ a: i * 3.75, h: Math.max(4, Math.round(v * 38)) + 'px', c: i < 37 ? accent : 'rgba(246,243,238,.22)' }); }
    return { accent, ring };
  }
}
</script>
</body>
</html>
