<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Now Playing, A+B+C</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Space+Grotesk:wght@500;700&amp;family=DM+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#fff}a:hover{color:#ddd}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0d1214; color: #f6f1e8; font-family: 'Space Grotesk', sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: -80px; overflow: hidden">
    <div style="position: absolute; width: 700px; height: 700px; border-radius: 50%; left: -240px; top: -280px; background: radial-gradient(closest-side, {{accent}}, rgba(0,0,0,0)); opacity: .7"></div>
    <div style="position: absolute; width: 620px; height: 620px; border-radius: 50%; left: 80px; top: 380px; background: radial-gradient(closest-side, #2f8f86, rgba(0,0,0,0)); opacity: .6"></div>
  </div>

  <div style="position: absolute; left: 18px; right: 18px; top: 16px; display: flex; justify-content: space-between; align-items: center">
    <button aria-label="Close" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(255,255,255,.12); color: #fff; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9.5l7 6 7-6"/></svg></button>
    <span style="font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .14em; color: rgba(246,241,232,.7)">SIDE A · TRACK 4</span>
    <button aria-label="More" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(255,255,255,.12); color: #fff; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg></button>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 50%; top: 250px; width: 330px; height: 330px; margin-left: -165px; margin-top: -165px">
    <sc-for list="{{ring}}" as="r" hint-placeholder-count="96"><div style="position: absolute; left: 163px; top: 0; width: 4px; height: 165px; transform-origin: 2px 165px; transform: rotate({{r.a}}deg)"><div style="width: 4px; height: {{r.h}}; border-radius: 2px; background: {{r.c}}"></div></div></sc-for>
  </div>
  <div role="img" aria-label="[ALBUM COVER]" style="position: absolute; left: 50%; top: 250px; width: 200px; height: 200px; margin-left: -100px; margin-top: -100px; border-radius: 18px; overflow: hidden; background: #2f5d62; transform: rotate(-4deg); box-shadow: 0 30px 60px rgba(0,0,0,.5)">
    <div style="position: absolute; width: 230px; height: 230px; border-radius: 50%; left: 80px; top: -80px; background: {{accent}}"></div>
    <div style="position: absolute; width: 140px; height: 140px; border-radius: 50%; left: -40px; top: 115px; background: #f2c6a0"></div>
  </div>

  <div style="position: absolute; left: 26px; right: 26px; top: 440px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px">
      <div style="font-family: 'Instrument Serif', serif; font-size: 50px; line-height: .95; letter-spacing: -.01em">Slow <i>Satellite</i></div>
      <button aria-label="Like" style="flex: none; width: 44px; height: 44px; border: 0; background: none; color: {{accent}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg></button>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; padding-bottom: 12px; border-bottom: 1px solid rgba(246,241,232,.35)">
      <span style="font-weight: 700; font-size: 16px">Marlow Fen</span>
      <span style="font-family: 'DM Mono', monospace; font-size: 11px; color: rgba(246,241,232,.7)">FLAC 24/96 · 1:36 / 4:12</span>
    </div>
  </div>

  <div style="position: absolute; left: 22px; right: 22px; top: 584px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Shuffle" style="width: 44px; height: 44px; border: 0; background: none; color: rgba(246,241,232,.7)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h2.5c4.5 0 5.5 10 10 10H20M4 17h2.5c1.6 0 2.8-1.3 3.8-3M14 10c1-1.7 2.2-3 3.8-3H20M17.5 4.5L20 7l-2.5 2.5M17.5 14.5L20 17l-2.5 2.5"/></svg></button>
    <button aria-label="Previous" style="width: 56px; height: 56px; border: 0; background: none; color: #fff"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5.5" width="2.6" height="13" rx="1.3"/><path d="M19 6.6v10.8a1 1 0 0 1-1.5.9L9.4 13a1.2 1.2 0 0 1 0-2l8.1-5.3a1 1 0 0 1 1.5.9z"/></svg></button>
    <button aria-label="Pause" style="width: 78px; height: 78px; border: 0; border-radius: 39px; background: #fff; color: #0d1214; display: grid; place-items: center; box-shadow: 0 14px 40px rgba(0,0,0,.35)"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.6"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6"/></svg></button>
    <button aria-label="Next" style="width: 56px; height: 56px; border: 0; background: none; color: #fff"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="16.4" y="5.5" width="2.6" height="13" rx="1.3"/><path d="M5 6.6v10.8a1 1 0 0 0 1.5.9l8.1-5.3a1.2 1.2 0 0 0 0-2L6.5 5.7A1 1 0 0 0 5 6.6z"/></svg></button>
    <button aria-label="Repeat" style="width: 44px; height: 44px; border: 0; background: none; color: rgba(246,241,232,.7)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 4l3 3-3 3M4 12v-1.5A3.5 3.5 0 0 1 7.5 7H20M7 20l-3-3 3-3M20 12v1.5a3.5 3.5 0 0 1-3.5 3.5H4"/></svg></button>
  </div>

  <div style="position: absolute; left: 26px; right: 26px; top: 690px; display: flex; gap: 10px">
    <button style="flex: 1; height: 46px; border: 1px solid rgba(246,241,232,.45); border-radius: 23px; background: none; color: #f6f1e8; font: inherit; font-size: 14px; font-weight: 700">Lyrics</button>
    <button style="flex: 1; height: 46px; border: 1px solid rgba(246,241,232,.45); border-radius: 23px; background: none; color: #f6f1e8; font: inherit; font-size: 14px; font-weight: 700">Up next</button>
    <button aria-label="Retro" style="width: 46px; height: 46px; border: 1px solid rgba(246,241,232,.45); border-radius: 23px; background: none; color: #f6f1e8; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3"/><circle cx="8.5" cy="12" r="2"/><circle cx="15.5" cy="12" r="2"/></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff8a5c","options":["#ff8a5c","#7fd6c8","#c9a2ff","#f5e15a"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#ff8a5c';
    const ring = [];
    for (let i = 0; i < 96; i++) { const v = .2 + .8 * Math.abs(Math.sin(i * .37) * Math.cos(i * .11 + 1) + .3 * Math.sin(i * 1.4)); ring.push({ a: i * 3.75, h: Math.max(4, Math.round(v * 40)) + 'px', c: i < 37 ? accent : 'rgba(246,241,232,.22)' }); }
    return { accent, ring };
  }
}
</script>
</body>
</html>
