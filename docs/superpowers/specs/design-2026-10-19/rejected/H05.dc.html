<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>H05 Tonal surface</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#a9e3d0}a:hover{color:#fff}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0f1f1c; color: #dcebe5; font-family: 'Outfit', sans-serif">
  <div style="position: absolute; left: 12px; right: 12px; top: 12px; display: flex; justify-content: space-between; align-items: center">
    <button aria-label="Close" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #1f332e; color: #dcebe5; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <span style="font-size: 14px; font-weight: 500; letter-spacing: .04em">Now playing</span>
    <button aria-label="Retro" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #1f332e; color: #dcebe5; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="8.5" cy="12" r="2"/><circle cx="15.5" cy="12" r="2"/></svg></button>
  </div>
  <div role="img" aria-label="[ALBUM COVER]" style="position: absolute; left: 30px; top: 70px; width: 330px; height: 306px; border-radius: 40px; overflow: hidden; background: #2f5d62">
    <div style="position: absolute; width: 340px; height: 340px; border-radius: 50%; left: 120px; top: -110px; background: #e8774f"></div>
    <div style="position: absolute; width: 200px; height: 200px; border-radius: 50%; left: -50px; top: 170px; background: #f2c6a0"></div>
  </div>
  <div style="position: absolute; left: 30px; right: 30px; top: 394px; display: flex; align-items: center; gap: 12px">
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 28px; font-weight: 600; line-height: 1.1; color: #eaf6f1">Slow Satellite</div>
      <div style="font-size: 16px; color: #a9c4ba; margin-top: 3px">Marlow Fen</div>
    </div>
    <button aria-label="Favourite" style="width: 52px; height: 52px; border: 0; border-radius: 26px; background: #2c4a42; color: #a9e3d0; display: grid; place-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
  </div>
  <div style="position: absolute; left: 30px; right: 30px; top: 478px">
    <svg width="330" height="32" viewBox="0 0 330 32" aria-hidden="true"><path d="{{wavePlayed}}" fill="none" stroke="#a9e3d0" stroke-width="5" stroke-linecap="round"/><path d="{{waveRest}}" fill="none" stroke="#3d5a52" stroke-width="5" stroke-linecap="round"/><circle cx="125" cy="16" r="9" fill="#a9e3d0"/></svg>
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #a9c4ba; margin-top: 4px"><span>1:36</span><span>4:12</span></div>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; top: 548px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Shuffle" style="width: 48px; height: 48px; border: 0; background: none; color: #dcebe5"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3 7h3c4 0 6 10 10 10h5M3 17h3c1.5 0 2.7-1.4 3.7-3M14.3 10C15.3 8.4 16.5 7 18 7h3M18 4l3 3-3 3M18 14l3 3-3 3"/></svg></button>
    <button aria-label="Previous" style="width: 64px; height: 56px; border: 0; border-radius: 28px; background: #1f332e; color: #dcebe5; display: grid; place-items: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zM19 6v12l-10-6z"/></svg></button>
    <button aria-label="Pause" style="width: 92px; height: 72px; border: 0; border-radius: 26px; background: #a9e3d0; color: #0f2a22; display: grid; place-items: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5.5" y="4" width="4.2" height="16" rx="1.4"/><rect x="14.3" y="4" width="4.2" height="16" rx="1.4"/></svg></button>
    <button aria-label="Next" style="width: 64px; height: 56px; border: 0; border-radius: 28px; background: #1f332e; color: #dcebe5; display: grid; place-items: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zM5 6v12l10-6z"/></svg></button>
    <button aria-label="Repeat" style="width: 48px; height: 48px; border: 0; background: none; color: #dcebe5"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/></svg></button>
  </div>
  <div style="position: absolute; left: 30px; right: 30px; top: 646px; display: flex; flex-wrap: wrap; gap: 10px">
    <span style="height: 40px; padding: 0 16px; border-radius: 12px; background: #2c4a42; color: #a9e3d0; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center">FLAC 24/96</span>
    <button style="height: 44px; padding: 0 16px; border: 1px solid #5d7d73; border-radius: 12px; background: none; color: #dcebe5; font: inherit; font-size: 14px; font-weight: 500">Lyrics</button>
    <button style="height: 44px; padding: 0 16px; border: 1px solid #5d7d73; border-radius: 12px; background: none; color: #dcebe5; font: inherit; font-size: 14px; font-weight: 500">Up next</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pt = (x) => { const amp = 3 + 9 * Math.abs(Math.sin(x * .021) * Math.cos(x * .007 + 1)); return [x, 16 + amp * Math.sin(x * .2)]; };
    let a = '', b = '';
    for (let x = 6; x <= 324; x += 3) { const p = pt(x); if (x <= 125) a += (a ? 'L' : 'M') + p[0] + ' ' + p[1].toFixed(1); if (x >= 125) b += (b ? 'L' : 'M') + p[0] + ' ' + p[1].toFixed(1); }
    return { wavePlayed: a, waveRest: b };
  }
}
</script>
</body>
</html>
