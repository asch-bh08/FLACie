<!doctype html>
<meta charset="utf-8">
<title>desk journal harness</title>
<!-- the journal as DeskJournal.razor renders it, eight lines with the line being sung last, in a desk of ?w= by ?h= pixels, styled by the real desk.css -->
<link rel="stylesheet" href="../../../src/FLACie.Server/wwwroot/desk.css">
<style>html, body { margin: 0; }</style>
<div class="desk" id="desk">
  <div class="desk-scene">
    <div class="desk-journal lift" data-testid="desk-journal">
      <div class="page">
        <div class="j-title">A song<small>An artist</small></div>
        <div class="j-lines" id="lines"></div>
        <div class="j-date">15 oct</div>
      </div>
    </div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search), d = document.getElementById('desk');
  d.style.width = (q.get('w') || 1600) + 'px'; d.style.height = (q.get('h') || 900) + 'px';
  const lines = document.getElementById('lines');
  for (let i = 0; i < 8; i++) { const l = document.createElement('div'); l.dataset.testid = 'desk-lyric'; l.textContent = 'line ' + i; if (i === 7) l.className = 'writing'; lines.appendChild(l); }
</script>
