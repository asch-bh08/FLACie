<!doctype html>
<html>
<head><meta charset="utf-8"><title>desk.js harness</title>
<!-- Drives wwwroot/desk.js on its own (1n-ipod-desk.spec.ts): a stand-in flacie.vizFrame() whose low bins kick twice a second, or nothing with ?null=1. -->
<style>body { margin: 0; } .desk { width: 800px; height: 450px; position: relative; } canvas { position: absolute; inset: 0; width: 100%; height: 100%; }</style>
</head>
<body>
<div class="desk" id="scene">
  <svg width="800" height="450" viewBox="0 0 800 450">
    <path id="cable" d="M 50 50 C 200 0, 300 200, 400 300" fill="none"/>
    <use data-pulse="a" href="#cable"/><use data-pulse="b" href="#cable"/>
    <g data-ripples></g>
    <g data-bud data-cx="400" data-cy="300"><g><path data-arc="0"/><path data-arc="1"/><path data-arc="2"/></g></g>
    <g data-bud data-cx="500" data-cy="320"><g><path data-arc="0"/><path data-arc="1"/><path data-arc="2"/></g></g>
  </svg>
  <canvas data-dust></canvas>
</div>
<script>
  const none = new URLSearchParams(location.search).has('null');
  window.flacie = {
    vizFrame() {
      if (none) return null;
      const t = performance.now() / 1000, kick = (t % 0.5) < 0.08;   // a kick every half second
      const freq = new Uint8Array(1024);
      for (let i = 0; i < 1024; i++) freq[i] = i >= 1 && i <= 8 ? (kick ? 240 : 40) : i <= 40 ? 120 : i <= 160 ? 70 : 10;
      return { freq, wave: new Uint8Array(2048).fill(128), playing: true };
    },
    vizRelease() { window.released = (window.released || 0) + 1; },
  };
</script>
<script src="../../../src/FLACie.Server/wwwroot/desk.js"></script>
</body>
</html>
